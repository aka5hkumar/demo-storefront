<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Nano Motion</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <meta name="theme-color" content="#2A1A14">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,800..900&family=DM+Sans:wght@400;600;700&display=swap">
  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth. -->
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .not-found {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding-block: 48px;
      background: var(--espresso);
      color: var(--cream);
      text-align: center;
    }
    .not-found__code {
      font-size: clamp(120px, 30vw, 260px);
      line-height: 0.85;
      color: var(--saffron);
    }
    .not-found h1 {
      margin-top: 16px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 0.95;
    }
    .not-found p {
      max-width: 420px;
      margin: 16px auto 32px;
      color: var(--text-on-dark);
    }
  </style>
</head>
<body>
  <main class="not-found page-gutter">
    <div>
      <div class="not-found__code display">404</div>
      <h1 class="display">This page took a rest day.</h1>
      <p>We couldn't find what you were looking for. The whole store lives on one page.</p>
      <a class="button button--primary" href="/">Back to the shop →</a>
    </div>
  </main>
</body>
</html>
